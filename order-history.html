<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order History | Mohor</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Ensures the page becomes visible immediately even if JS is delayed */
    body { opacity: 1 !important; }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="brand-logo"><img src="assets/logo-ink.png" alt="Mohor" width="150"></a>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-ghost" data-i18n="navShop">Shop</a>
        <button type="button" id="openAccountBtn" class="icon-btn" data-i18n="navAccount">Account</button>
      </div>
    </nav>
  </header>

  <main class="container" style="padding:36px 5% 80px; max-width:900px;">
    <h1 style="margin-bottom:8px;" data-i18n="accOrderHistory">Order History</h1>
    <p style="color:var(--ink-muted); margin-bottom:18px;">A consolidated view of your past orders. Sign in if you are not already.</p>

    <div id="userOrderHistoryContainer">
      <p class="order-history-loading" data-i18n="accLoadingOrders">Loading orders…</p>
    </div>
  </main>

  <footer class="site-footer" style="margin-top: 60px;">
    <div class="container" style="text-align: center; padding: 20px 0;">
      <p style="font-size: 12px; color: rgba(250,243,236,0.6);" data-i18n="footerText">&copy; 2026 Mohor Clothings Bangladesh. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Firebase CDN SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  
  <script>
    const firebaseConfig = {
        apiKey: "AIzaSyALxypXDkF9QexbD_wE7-ADALIdj5vd-rY",
        authDomain: "mohor-app.firebaseapp.com",
        projectId: "mohor-app",
        storageBucket: "mohor-app.firebasestorage.app",
        messagingSenderId: "989000457004",
        appId: "1:989000457004:web:5679b256e20d94e27daa89"
    };
    if (typeof firebase !== 'undefined' && !firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    window.db = firebase.firestore();
  </script>

  <!-- Required JS Files including app.js and auth.js -->
  <script src="app.js?v=20"></script>
  <script src="cart.js?v=20"></script>
  <script type="module" src="auth.js?v=20"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('userOrderHistoryContainer');
      if (typeof firebase !== 'undefined' && firebase.auth) {
        firebase.auth().onAuthStateChanged((user) => {
          if (user) {
            if (typeof window.loadUserOrders === 'function') {
              window.loadUserOrders(user.uid);
            } else {
              container.innerHTML = '<p style="color:var(--ink-muted);">Please check back in a moment as account scripts load.</p>';
            }
          } else {
            container.innerHTML = '<p style="color:var(--ink-muted);">Please sign in to view your order history. Open Account (top-right) to log in.</p>';
          }
        });
      } else {
        container.innerHTML = '<p style="color:var(--ink-muted);">Please sign in to view your order history. Open Account (top-right) to log in.</p>';
      }
      
      setTimeout(() => { if (typeof updateUIText === 'function') updateUIText(); }, 50);
    });
  </script>
</body>
</html>
