<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up | Mohor Clothings</title>
  <link rel="icon" href="assets/favicon-32.png">
  <link rel="stylesheet" href="style.css?v=42">
  <style>
    .standalone-auth { min-height:100vh; display:grid; place-items:center; padding:32px 16px; background:var(--muslin); }
    .auth-panel { width:min(100%, 430px); padding:40px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); }
    .auth-panel h1 { margin:24px 0 8px; text-align:center; }
    .auth-panel p { color:var(--ink-muted); text-align:center; }
    .auth-panel form { margin-top:24px; }
    .auth-panel label { display:block; margin:14px 0 6px; color:var(--ink-muted); font-size:.82rem; }
    .auth-panel input { width:100%; box-sizing:border-box; }
    .auth-error { min-height:20px; color:var(--rust); font-size:.85rem; }
    .auth-panel a { color:var(--maroon); font-weight:600; }
  </style>
</head>
<body>
  <main class="standalone-auth">
    <section class="auth-panel">
      <a href="/" aria-label="Mohor home"><img src="assets/logo-ink.png" alt="Mohor Clothings" width="150"></a>
      <h1>Create your account</h1>
      <p>Save your details for a faster checkout.</p>
      <form id="signupForm">
        <label for="name">Full Name</label>
        <input class="input" id="name" autocomplete="name" required>
        <label for="phone">Phone Number</label>
        <input class="input" id="phone" type="tel" autocomplete="tel" required>
        <label for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input class="input" id="password" type="password" autocomplete="new-password" minlength="6" required>
        <p class="auth-error" id="error" role="alert"></p>
        <button class="btn btn-dark btn-block" type="submit">Sign up</button>
      </form>
      <p>Already have an account? <a href="/login.html">Log in</a></p>
    </section>
  </main>
  <script>
    document.getElementById('signupForm').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('error');
      const nameInput = document.getElementById('name');
      const phoneInput = document.getElementById('phone');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      error.textContent = '';
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: nameInput.value.trim(), phone: phoneInput.value.trim(), email: emailInput.value.trim(), password: passwordInput.value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Unable to create your account.');
        localStorage.setItem('authToken', data.token);
        localStorage.setItem('authUser', JSON.stringify(data.user));
        window.location.href = '/account.html';
      } catch (exception) { error.textContent = exception.message; }
    });
  </script>
</body>
</html>
