    <script>
        let currentSelectedSize = null;
        let currentSelectedColor = null;
        let activeProduct = null;
        let currentImageIndex = 0;
        let galleryTimer = null;
        let galleryTransitionTimer = null;
        let zoomScale = 1;

        function getProductText(field) {
            if (!field) return "";
            if (typeof field === 'string') return field;
            return field[window.currentLang] || field['en'] || "";
        }

        function setMainImage(src, altText, animate) {
            const mainImg = document.getElementById('mainImage');
            const nextImg = document.getElementById('nextImage');
            if (!nextImg || animate === false || !mainImg.src) {
                window.clearTimeout(galleryTransitionTimer);
                mainImg.className = '';
                if (nextImg) {
                    nextImg.className = '';
                    nextImg.src = '';
                }
                mainImg.src = src;
                if (altText) mainImg.alt = altText;
                return;
            }
            window.clearTimeout(galleryTransitionTimer);
            nextImg.src = src;
            nextImg.alt = altText || '';
            nextImg.className = 'gallery-slide-in';
            mainImg.classList.add('gallery-slide-out');
            requestAnimationFrame(() => nextImg.classList.add('gallery-slide-active'));
            galleryTransitionTimer = window.setTimeout(() => {
                mainImg.src = src;
                if (altText) mainImg.alt = altText;
                mainImg.className = '';
                nextImg.className = '';
                nextImg.src = '';
            }, 560);
        }

        function setGalleryImage(index) {
            if (!activeProduct) return;
            const images = (activeProduct.images && activeProduct.images.length > 0) ? activeProduct.images : ['assets/image-placeholder.svg'];
            currentImageIndex = (index + images.length) % images.length;
            const altText = `${getProductText(activeProduct.title)} - Mohor Dress Image ${currentImageIndex + 1}`;
            setMainImage(images[currentImageIndex], altText);
            const thumbContainer = document.getElementById('thumbnailContainer');
            if (thumbContainer) thumbContainer.querySelectorAll('.thumbnail').forEach((t, i) => t.classList.toggle('active', i === currentImageIndex));
        }

        function renderDynamicText() {
            if (!activeProduct) return;

            document.getElementById('prodTitle').innerText = getProductText(activeProduct.title);
            document.getElementById('prodDesc').innerHTML = getProductText(activeProduct.description);
            document.getElementById('prodCategory').innerText = (activeProduct.category || '').replace('-', ' ');

            const detailsList = document.getElementById('prodDetails');
            const detailsSection = document.getElementById('detailsSection');
            detailsList.innerHTML = '';
            let detailsArray = [];
            if (activeProduct.details) detailsArray = Array.isArray(activeProduct.details) ? activeProduct.details : (activeProduct.details[window.currentLang] || activeProduct.details['en'] || []);
            if (detailsArray.length > 0) {
                detailsSection.style.display = 'block';
                detailsArray.forEach(text => { const li = document.createElement('li'); li.innerText = text; detailsList.appendChild(li); });
            } else {
                detailsSection.style.display = 'none';
            }

            const renderInfoList = (field, sectionId, listId) => {
                const values = activeProduct[field];
                const items = Array.isArray(values) ? values : (values?.[window.currentLang] || values?.en || []);
                const section = document.getElementById(sectionId);
                const list = document.getElementById(listId);
                list.innerHTML = items.map(item => `<li>${item}</li>`).join('');
                section.style.display = items.length ? 'block' : 'none';
            };
            renderInfoList('materials', 'materialsSection', 'prodMaterials');
            renderInfoList('care', 'careSection', 'prodCare');

            if (currentSelectedSize && activeProduct.sizeMeasurements && activeProduct.sizeMeasurements[currentSelectedSize]) {
                const box = document.getElementById('sizeMeasurements');
                const md = activeProduct.sizeMeasurements[currentSelectedSize];
                box.innerHTML = (typeof md === 'string') ? md : (md[window.currentLang] || md['en'] || "");
            }
        }

        window.addEventListener('languageChanged', renderDynamicText);

        if (typeof window.loadStoreProduct !== 'function') {
            window.loadStoreProduct = async function(productId) {
                if (!productId || !window.db || typeof window.db.collection !== 'function') return null;
                try {
                    const snapshot = await window.db.collection('products').doc(String(productId)).get();
                    if (!snapshot.exists) return null;
                    const data = snapshot.data() || {};
                    return { id: String(snapshot.id), ...data };
                } catch (error) {
                    console.error('Error loading product:', error);
                    return null;
                }
            };
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const targetId = params.get('id');

            activeProduct = await window.loadStoreProduct(targetId);
            if (!activeProduct) {
                const fallbackProducts = window.productsData || [];
                activeProduct = fallbackProducts.find(p => String(p.id) === String(targetId));
            }

            if (!activeProduct) {
                document.getElementById('prodTitle').innerText = 'Product Not Found';
                document.getElementById('mainImageWrap').innerHTML = '';
                return;
            }

            const wishlistButton = document.getElementById('productWishlistBtn');
            const syncWishlistButton = () => {
                const active = typeof window.isWishlisted === 'function' && window.isWishlisted(activeProduct.id);
                if (!wishlistButton) return;
                wishlistButton.classList.toggle('is-active', active);
                wishlistButton.setAttribute('aria-pressed', String(active));
                wishlistButton.setAttribute('aria-label', active ? 'Remove from wishlist' : 'Add to wishlist');
                wishlistButton.textContent = active ? '♥ Saved to wishlist' : '♡ Save to wishlist';
            };
            if (wishlistButton) wishlistButton.addEventListener('click', () => {
                if (typeof window.toggleWishlist === 'function') window.toggleWishlist(activeProduct.id);
                syncWishlistButton();
            });
            window.addEventListener('wishlistChanged', syncWishlistButton);
            syncWishlistButton();

            // SEO & Google Image Indexing Dynamic Enhancements
            const prodTitleStr = getProductText(activeProduct.title);
            document.title = `${prodTitleStr} | Mohor Clothings - Mohor Dress`;

            let metaDesc = document.querySelector('meta[name="description"]');
            if (!metaDesc) { metaDesc = document.createElement('meta'); metaDesc.name = "description"; document.head.appendChild(metaDesc); }
            metaDesc.content = `${prodTitleStr} by Mohor Clothings. ${getProductText(activeProduct.description).slice(0, 150)}`;

            let ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) ogTitle.content = `${prodTitleStr} | Mohor Clothings - Mohor Dress`;

            let ogDesc = document.querySelector('meta[property="og:description"]');
            if (ogDesc) ogDesc.content = getProductText(activeProduct.description).slice(0, 150);

            const images = (activeProduct.images && activeProduct.images.length > 0) ? activeProduct.images : ['assets/image-placeholder.svg'];
            let ogImg = document.querySelector('meta[property="og:image"]');
            const absoluteImageUrl = imageUrl => imageUrl.startsWith('http') ? imageUrl : new URL(imageUrl, document.baseURI).href;
            if (ogImg && images[0]) ogImg.content = absoluteImageUrl(images[0]);

            let canonical = document.querySelector('link[rel="canonical"]');
            if (canonical) canonical.href = `https://mohor.me/product/?id=${encodeURIComponent(activeProduct.id)}`;

            const mainImgEl = document.getElementById('mainImage');
            const keywordAltText = `${prodTitleStr} - Mohor Clothings Mohor Dress`;
            if (mainImgEl) mainImgEl.alt = keywordAltText;

            // Dynamic Schema.org Product JSON-LD Metadata Injection
            const schemaData = {
                "@context": "https://schema.org/",
                "@type": "Product",
                "name": prodTitleStr + " - Mohor Clothings Mohor Dress",
                "image": images.map(absoluteImageUrl),
                "description": getProductText(activeProduct.description) || `${prodTitleStr} - Handcrafted Mohor Dress`,
                "brand": {
                    "@type": "Brand",
                    "name": "Mohor Clothings",
                    "alternateName": ["Mohor", "Mohor Cloth", "Mohor Dress"]
                },
                "offers": {
                    "@type": "Offer",
                    "url": window.location.href,
                    "priceCurrency": "BDT",
                    "price": activeProduct.salePrice || activeProduct.price,
                    "availability": "https://schema.org/InStock",
                    "itemCondition": "https://schema.org/NewCondition"
                }
            };
            const scriptTag = document.createElement('script');
            scriptTag.type = 'application/ld+json';
            scriptTag.textContent = JSON.stringify(schemaData);
            document.head.appendChild(scriptTag);

            // Render Price with Regular & Sale Price support
            const priceEl = document.getElementById('prodPrice');
            const regPrice = activeProduct.originalPrice || activeProduct.regularPrice || activeProduct.price;
            const salePrice = activeProduct.price < regPrice ? activeProduct.price : (activeProduct.salePrice || null);
            if (salePrice && Number(salePrice) < Number(regPrice)) {
                const discountPct = Math.round(((regPrice - salePrice) / regPrice) * 100);
                priceEl.innerHTML = `<span class="price-original">৳ ${regPrice}</span> <span class="price-sale">৳ ${salePrice}</span> <span class="sale-badge">-${discountPct}% OFF</span>`;
            } else {
                priceEl.innerText = '৳ ' + regPrice;
            }

            renderDynamicText();

            const thumbContainer = document.getElementById('thumbnailContainer');
            setMainImage(images[0], keywordAltText, false);

            images.forEach((imgSrc, index) => {
                const thumb = document.createElement('div');
                thumb.className = 'thumbnail' + (index === 0 ? ' active' : '');
                const thumbAltText = `${prodTitleStr} - Mohor Dress Image ${index + 1}`;
                thumb.innerHTML = `<img src="${imgSrc}" alt="${thumbAltText}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='assets/image-placeholder.svg';">`;
                thumb.onclick = () => {
                    currentImageIndex = index;
                    setMainImage(imgSrc, thumbAltText);
                    thumbContainer.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
                    thumb.classList.add('active');
                };
                thumbContainer.appendChild(thumb);
            });
            document.getElementById('mainImage').onerror = function() { this.onerror = null; this.src = 'assets/image-placeholder.svg'; };

            // Render Recommendations
            if (typeof window.renderRelatedProducts === 'function') {
                window.renderRelatedProducts(activeProduct, 'relatedProductsGrid');
            } else if (typeof renderRelatedProducts === 'function') {
                renderRelatedProducts(activeProduct, 'relatedProductsGrid');
            }
            const relatedGrid = document.getElementById('relatedProductsGrid');
            document.getElementById('relatedPrev').onclick = () => relatedGrid.scrollBy({ left: -relatedGrid.clientWidth * .8, behavior: 'smooth' });
            document.getElementById('relatedNext').onclick = () => relatedGrid.scrollBy({ left: relatedGrid.clientWidth * .8, behavior: 'smooth' });

            // Sizes (toggle to unselect)
            const sizeContainer = document.getElementById('sizeOptions');
            const measurementBox = document.getElementById('sizeMeasurements');
            const stockStatus = document.getElementById('stockStatus');
            const getSizeQuantity = (size, color) => typeof window.getProductSizeQuantity === 'function'
                ? window.getProductSizeQuantity(activeProduct, size, color)
                : Number(activeProduct.quantity || 0);
            const refreshSizeAvailability = () => {
                const buttons = sizeContainer.querySelectorAll('.size-btn');
                let availableCount = 0;
                buttons.forEach(btn => {
                    const size = btn.dataset.size;
                    const available = getSizeQuantity(size, currentSelectedColor) > 0;
                    btn.disabled = !available;
                    btn.classList.toggle('is-sold-out', !available);
                    btn.setAttribute('aria-label', available ? `${size} available` : `${size} sold out`);
                    if (available) availableCount++;
                    if (!available && btn.classList.contains('selected')) {
                        btn.classList.remove('selected');
                        currentSelectedSize = null;
                    }
                });
                if (stockStatus) {
                    stockStatus.textContent = availableCount ? 'Available in selected sizes' : 'Out of stock';
                    stockStatus.classList.toggle('is-out', availableCount === 0);
                }
            };
            if (activeProduct.sizes && activeProduct.sizes.length > 0) {
                activeProduct.sizes.forEach(size => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'opt-btn size-btn';
                    btn.innerText = size;
                    btn.dataset.size = size;
                    btn.onclick = () => {
                        const warn = document.getElementById('sizeWarning');
                        if (btn.classList.contains('selected')) {
                            btn.classList.remove('selected');
                            currentSelectedSize = null;
                            measurementBox.classList.remove('show');
                        } else {
                            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
                            btn.classList.add('selected');
                            currentSelectedSize = size;
                            if (warn) warn.classList.remove('show');
                            if (activeProduct.sizeMeasurements && activeProduct.sizeMeasurements[size]) {
                                const md = activeProduct.sizeMeasurements[size];
                                measurementBox.innerHTML = (typeof md === 'string') ? md : (md[window.currentLang] || md['en'] || "");
                                measurementBox.classList.add('show');
                            } else {
                                measurementBox.classList.remove('show');
                            }
                        }
                    };
                    sizeContainer.appendChild(btn);
                });
            }
            refreshSizeAvailability();

            // Colors (toggle to unselect)
            const colorContainer = document.getElementById('colorOptions');
            const colorSection = document.getElementById('colorSection');
            let colorArray = [];
            if (activeProduct.colors) colorArray = Array.isArray(activeProduct.colors) ? activeProduct.colors : (activeProduct.colors[window.currentLang] || activeProduct.colors['en'] || []);

            if (colorArray.length > 0) {
                colorSection.style.display = 'block';
                colorArray.forEach(color => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    const rawColorName = typeof color === 'string' ? color : (color.name || color.label || color.title || '');
                    const colorName = typeof rawColorName === 'string'
                        ? rawColorName
                        : (rawColorName[window.currentLang] || rawColorName.en || '');
                    const colorValue = typeof color === 'object' ? (color.hex || color.value || color.color || '') : '';
                    btn.className = 'opt-btn color-btn' + (colorValue ? ' color-swatch-btn' : '');
                    if (colorValue) btn.style.setProperty('--swatch-color', colorValue);
                    btn.innerHTML = colorValue
                        ? `<span class="color-swatch" aria-hidden="true"></span><span>${colorName}</span>`
                        : colorName;
                    const colorHasStock = (activeProduct.sizes || ['Standard']).some(size => getSizeQuantity(size, colorName) > 0);
                    btn.disabled = !colorHasStock;
                    btn.classList.toggle('is-sold-out', !colorHasStock);
                    if (!colorHasStock) btn.setAttribute('aria-label', `${colorName} sold out`);
                    btn.onclick = () => {
                        const warn = document.getElementById('colorWarning');
                        if (btn.classList.contains('selected')) {
                            btn.classList.remove('selected');
                            currentSelectedColor = null;
                            refreshSizeAvailability();
                        } else {
                            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                            btn.classList.add('selected');
                            currentSelectedColor = colorName;
                            if (warn) warn.classList.remove('show');
                            refreshSizeAvailability();
                        }
                    };
                    colorContainer.appendChild(btn);
                });
            }

            function validateSelection() {
                let valid = true;
                if (activeProduct.sizes && activeProduct.sizes.length > 0 && !currentSelectedSize) {
                    const warn = document.getElementById('sizeWarning'); if (warn) warn.classList.add('show');
                    valid = false;
                }
                if (currentSelectedSize && getSizeQuantity(currentSelectedSize, currentSelectedColor) <= 0) {
                    const warn = document.getElementById('sizeWarning');
                    if (warn) { warn.textContent = 'This size is out of stock'; warn.classList.add('show'); }
                    valid = false;
                }
                if (colorArray.length > 0 && !currentSelectedColor) {
                    const warn = document.getElementById('colorWarning'); if (warn) warn.classList.add('show');
                    valid = false;
                }
                return valid;
            }

            function doAddToCart() {
                if (!validateSelection()) return false;
                if (typeof window.addToCart === 'function') {
                    return window.addToCart(activeProduct, currentSelectedSize || 'Standard', currentSelectedColor);
                }
                return false;
            }

            document.getElementById('addToCartBtn').onclick = doAddToCart;
            document.getElementById('addToCartBtnMobile').onclick = doAddToCart;
            function buyNow() {
                if (doAddToCart()) window.location.assign('/cart/');
            }
            document.getElementById('buyNowBtnInline').onclick = buyNow;
            document.getElementById('buyNowBtn').onclick = buyNow;

            // Lightbox
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            const zoomStage = document.getElementById('lightboxZoomStage');

            function updateZoom() {
                zoomScale = Math.max(1, Math.min(3, zoomScale));
                modalImg.style.transform = `scale(${zoomScale})`;
                zoomStage.classList.toggle('is-zoomed', zoomScale > 1);
            }
            function resetZoom() { zoomScale = 1; updateZoom(); }

            document.getElementById('mainImage').onclick = function() {
                modal.classList.add('active');
                modalImg.src = images[currentImageIndex];
                modalImg.alt = `${prodTitleStr} - Mohor Dress Full Image ${currentImageIndex + 1}`;
                resetZoom();
            };
            document.getElementById('closeModal').onclick = () => modal.classList.remove('active');
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') modal.classList.remove('active'); });

            function changeImage(direction) {
                currentImageIndex = (currentImageIndex + direction + images.length) % images.length;
                modalImg.src = images[currentImageIndex];
                resetZoom();
                const activeAltText = `${prodTitleStr} - Mohor Dress Image ${currentImageIndex + 1}`;
                modalImg.alt = activeAltText;
                setMainImage(images[currentImageIndex], activeAltText);
                thumbContainer.querySelectorAll('.thumbnail').forEach((t, i) => t.classList.toggle('active', i === currentImageIndex));
            }
            document.getElementById('nextModal').onclick = () => changeImage(1);
            document.getElementById('prevModal').onclick = () => changeImage(-1);
            document.getElementById('galleryPrev').onclick = (event) => { event.stopPropagation(); setGalleryImage(currentImageIndex - 1); };
            document.getElementById('galleryNext').onclick = (event) => { event.stopPropagation(); setGalleryImage(currentImageIndex + 1); };
            document.getElementById('zoomIn').onclick = () => { zoomScale += 0.5; updateZoom(); };
            document.getElementById('zoomOut').onclick = () => { zoomScale -= 0.5; updateZoom(); };
            document.getElementById('zoomReset').onclick = resetZoom;
            zoomStage.addEventListener('wheel', (event) => {
                event.preventDefault();
                zoomScale += event.deltaY < 0 ? 0.25 : -0.25;
                updateZoom();
            }, { passive: false });
            zoomStage.addEventListener('dblclick', () => {
                zoomScale = zoomScale > 1 ? 1 : 2;
                updateZoom();
            });

            let touchstartX = 0, touchendX = 0;
            modal.addEventListener('touchstart', e => { if (e.touches.length === 1) touchstartX = e.changedTouches[0].screenX; });
            modal.addEventListener('touchend', e => {
                if (e.changedTouches.length !== 1) return;
                touchendX = e.changedTouches[0].screenX;
                const threshold = 50;
                if (touchendX < touchstartX - threshold) changeImage(1);
                if (touchendX > touchstartX + threshold) changeImage(-1);
            });

            if (images.length > 1) {
                galleryTimer = window.setInterval(() => {
                    if (!modal.classList.contains('active') && !document.hidden) setGalleryImage(currentImageIndex + 1);
                }, 5000);
                document.getElementById('mainImageWrap').addEventListener('mouseenter', () => window.clearInterval(galleryTimer));
                document.getElementById('mainImageWrap').addEventListener('mouseleave', () => {
                    window.clearInterval(galleryTimer);
                    galleryTimer = window.setInterval(() => {
                        if (!modal.classList.contains('active') && !document.hidden) setGalleryImage(currentImageIndex + 1);
                    }, 5000);
                });
            }

            const lbAdd = document.getElementById('lightboxAddToCart');
            const lbBuy = document.getElementById('lightboxBuyNow');
            if (lbAdd) {
                lbAdd.addEventListener('click', () => {
                    if (doAddToCart()) modal.classList.remove('active');
                });
            }
            if (lbBuy) {
                lbBuy.addEventListener('click', () => {
                    buyNow();
                });
            }
        });
    </script>

    <script>
        const loadMetaPixel = () => {
            if (window.fbq) return;
            !function(f,b,e,v,n,t,s)
            {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
            n.callMethod.apply(n,arguments):n.queue.push(arguments)};
            if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
            n.queue=[];t=b.createElement(e);t.async=!0;
            t.src=v;s=b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t,s)}(window, document,'script',
            'https://connect.facebook.net/en_US/fbevents.js');
            fbq('init', '920711640501746');
        };
        let pageLoaded = document.readyState === 'complete';
        let metaPixelScheduled = false;
        const scheduleMetaPixel = () => {
            if (!pageLoaded || metaPixelScheduled) return;
            metaPixelScheduled = true;
            if ('requestIdleCallback' in window) {
                requestIdleCallback(loadMetaPixel, { timeout: 4000 });
            } else {
                window.setTimeout(loadMetaPixel, 2500);
            }
        };
        window.addEventListener('load', () => { pageLoaded = true; scheduleMetaPixel(); }, { once: true });
        scheduleMetaPixel();
    </script>

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/sw.js").catch((err) => {

            });
        }
    </script>
