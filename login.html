<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mohor</title>
    <!-- Link your existing CSS file here -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div class="login-container" style="text-align: center; margin-top: 50px;">
        <h2>Welcome to Mohor</h2>
        <p>Log in to save your details for faster checkout.</p>
        
        <form id="customer-login-form" style="max-width: 300px; margin: 0 auto;">
            <input type="email" id="customer-email" placeholder="Email Address" required style="display: block; width: 100%; margin-bottom: 10px; padding: 8px;">
            <input type="password" id="customer-password" placeholder="Password" required style="display: block; width: 100%; margin-bottom: 10px; padding: 8px;">
            
            <button type="submit" style="width: 100%; padding: 10px; background-color: #333; color: white;">Log In</button>
        </form>

        <p style="margin-top: 20px;">
            Don't have an account? <a href="#">Sign up</a><br><br>
            <a href="index.html">← Continue as Guest</a>
        </p>
    </div>

    <!-- ADDED: Firebase CDN SDKs so auth.js actually works on this page -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyALxypXDkF9QexbD_wE7-ADALIdj5vd-rY",
            authDomain: "mohor-app.firebaseapp.com",
            projectId: "mohor-app",
            storageBucket: "mohor-app.firebasestorage.app",
            messagingSenderId: "989000457004",
            appId: "1:989000457004:web:5679b256e20d94e27daa89"
        };
        firebase.initializeApp(firebaseConfig);
        window.db = firebase.firestore();
    </script>

    <!-- Added type="module" and Cache Buster -->
    <script type="module" src="auth.js?v=15"></script> 
</body>
</html>
