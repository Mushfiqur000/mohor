<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHOR | Premium Handcrafted Women's Clothing</title>
    <!-- Google Fonts for Luxury Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #121212;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-gold: #d4af37;
            --border-color: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Header / Logo Section */
        header {
            text-align: center;
            padding: 60px 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--text-main);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            font-weight: 300;
            text-transform: uppercase;
        }

        /* Filter & Sort Controls Container */
        .controls-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Category Filter Row */
        .category-filter {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .filter-btn:hover, .filter-btn.active {
            color: var(--text-main);
            border-color: var(--accent-gold);
            background-color: rgba(212, 175, 55, 0.05);
        }

        /* Sorting Dropdown Row */
        .sort-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
        }

        .sort-row label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sort-select {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            letter-spacing: 1px;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.4s ease, border-color 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .product-image-wrapper {
            position: relative;
            padding-top: 135%; /* Elegant high-fashion portrait ratio */
            background-color: #1a1a1a;
            overflow: hidden;
        }

        .product-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.05);
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            text-align: center;
        }

        .product-category {
            font-size: 0.75rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        .product-tagline {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-style: italic;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 500;
            margin-top: auto;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        /* Premium Actions */
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            padding: 12px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .btn-whatsapp {
            background-color: #25d366;
            color: #ffffff;
        }

        .btn-whatsapp:hover {
            background-color: #20ba5a;
        }

        .btn-facebook {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--text-main);
        }

        .btn-facebook:hover {
            background-color: var(--text-main);
            color: var(--bg-color);
        }

        /* Footer Section */
        footer {
            text-align: center;
            padding: 60px 20px 20px;
            margin-top: 60px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        footer a {
            color: var(--accent-gold);
            text-decoration: none;
            margin: 0 10px;
        }

        /* Responsive styling */
        @media (max-width: 768px) {
            .logo { font-size: 2.5rem; }
            .controls-container { margin: 15px auto; }
            .sort-row { justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Mohor</div>
        <div class="tagline">Luxury Handcrafted Women's Clothing from Bangladesh</div>
    </header>

    <div class="controls-container">
        <!-- Category Filter Buttons -->
        <div class="category-filter" id="categoryFilter">
            <button class="filter-btn active" data-category="all">All Collection</button>
            <button class="filter-btn" data-category="kurti">Kurti</button>
            <button class="filter-btn" data-category="khadi">Khadi</button>
            <button class="filter-btn" data-category="three-piece">Three Piece</button>
            <button class="filter-btn" data-category="two-piece">Two Piece</button>
            <button class="filter-btn" data-category="one-piece">One Piece</button>
            <button class="filter-btn" data-category="formal">Formal Wear</button>
        </div>

        <!-- Sorting Menu -->
        <div class="sort-row">
            <label for="sortSelect">Sort By:</label>
            <select id="sortSelect" class="sort-select">
                <option value="default">Featured</option>
                <option value="price-low">Price: Low to High</option>
                <option value="price-high">Price: High to Low</option>
                <option value="alpha-az">Alphabetical: A-Z</option>
            </select>
        </div>
    </div>

    <!-- Dynamic Product Grid Area -->
    <main class="product-grid" id="productGrid">
        <!-- Products will be generated dynamically by JavaScript below -->
    </main>

    <footer>
        <p>MOHOR &copy; 2026 Bangladesh. All Rights Reserved.</p>
        <p style="margin-top: 10px;">
            <a href="https://www.facebook.com/share/1Be3jj7iqb/?mibextid=wwXIfr" target="_blank">Facebook</a> | 
            <a href="https://www.instagram.com/mohorclothings" target="_blank">Instagram</a>
        </p>
    </footer>

    <!-- JavaScript Data and Sorting Logic -->
    <script>
        // 1. YOUR PRODUCT INVENTORY DATA
        // Simply change titles, categories, prices, and image filenames here!
        const productsData = [
            {
                id: 1,
                title: "Premium Handcrafted Kurti",
                category: "kurti",
                tagline: "Perfect wear for university, office, or viva",
                price: 1850, 
                image: "dress1.png"
            },
            {
                id: 2,
                title: "Luxury Khadi Ensemble",
                category: "khadi",
                tagline: "Traditional fabric reimagined for modern elegance",
                price: 3200,
                image: "dress2.png"
            },
            {
                id: 4,
                title: "Designer Three Piece Suit",
                category: "three-piece",
                tagline: "Intricate handcrafted detailing with luxury touch",
                price: 4500,
                image: "dress4.png"
            },
            {
                id: 5,
                title: "Elegant Two Piece Co-ord",
                category: "two-piece",
                tagline: "Sophisticated styling for smart casual comfort",
                price: 2650,
                image: "dress5.png"
            },
            {
                id: 6,
                title: "Classic White Formal Wear",
                category: "formal",
                tagline: "Crisp, premium tailored design for presentations & office",
                price: 2200,
                image: "dress6.png"
            },
            {
                id: 7,
                title: "Luxury One Piece Tunic",
                category: "one-piece",
                tagline: "Vibrant hues crafted out of premium luxury fabrics",
                price: 1500,
                image: "dress7.png"
            }
        ];

        // Global State variables
        let currentProducts = [...productsData];
        let currentCategory = "all";

        const productGrid = document.getElementById('productGrid');
        const categoryFilterContainer = document.getElementById('categoryFilter');
        const sortSelect = document.getElementById('sortSelect');

        // Contact Constants
        const WHATSAPP_NUMBER = "01330113027";
        const FB_PAGE_URL = "https://www.facebook.com/share/1Be3jj7iqb/?mibextid=wwXIfr";

        // 2. RENDER PRODUCTS FUNCTION
        function renderProducts(products) {
            productGrid.innerHTML = "";
            
            if(products.length === 0) {
                productGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">No items found in this category.</p>`;
                return;
            }

            products.forEach(product => {
                // Generate clear order messages for customers
                const whatsappMessage = encodeURIComponent(`Hello MOHOR, I am interested in ordering the "${product.title}" (${product.category.toUpperCase()}) priced at ৳${product.price}.`);
                const whatsappLink = `https://wa.me/${WHATSAPP_NUMBER}?text=${whatsappMessage}`;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image-wrapper">
                        <img src="${product.image}" alt="${product.title}" class="product-image" onerror="this.src='https://via.placeholder.com/400x540/121212/ffffff?text=MOHOR+Luxury'">
                    </div>
                    <div class="product-info">
                        <span class="product-category">${product.category.replace('-', ' ')}</span>
                        <h3 class="product-title">${product.title}</h3>
                        <p class="product-tagline">${product.tagline}</p>
                        <div class="product-price">৳${product.price}</div>
                        <div class="action-buttons">
                            <a href="${whatsappLink}" target="_blank" class="btn btn-whatsapp">WhatsApp</a>
                            <a href="${FB_PAGE_URL}" target="_blank" class="btn btn-facebook">Inbox FB</a>
                        </div>
                    </div>
                `;
                productGrid.appendChild(card);
            });
        }

        // 3. FILTER LOGIC
        categoryFilterContainer.addEventListener('click', (e) => {
            if (!e.target.classList.contains('filter-btn')) return;

            // Update UI Active State
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            e.target.classList.add('active');

            // Apply filter filter status
            currentCategory = e.target.getAttribute('data-category');
            applyFilterAndSort();
        });

        // 4. SORT LOGIC
        sortSelect.addEventListener('change', () => {
            applyFilterAndSort();
        });

        // Combined Filter and Sort Master Function
        function applyFilterAndSort() {
            // Filter first
            if (currentCategory === 'all') {
                currentProducts = [...productsData];
            } else {
                currentProducts = productsData.filter(p => p.category === currentCategory);
            }

            // Sort second
            const sortValue = sortSelect.value;
            if (sortValue === 'price-low') {
                currentProducts.sort((a, b) => a.price - b.price);
            } else if (sortValue === 'price-high') {
                currentProducts.sort((a, b) => b.price - a.price);
            } else if (sortValue === 'alpha-az') {
                currentProducts.sort((a, b) => a.title.localeCompare(b.title));
            }
            
            // Render the results
            renderProducts(currentProducts);
        }

        // Initial Load Display
        renderProducts(currentProducts);
    </script>
</body>
</html>
