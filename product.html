<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Details | Mohor</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* Essential Clean Styles */
        :root { --primary-gold: #C9A14A; --deep-black: #0c0c0c; --white: #ffffff; --border: #eaeaea; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--white); color: var(--deep-black); padding-bottom: 90px; }
        
        nav { display: flex; justify-content: space-between; padding: 15px 5%; border-bottom: 1px solid var(--border); }
        .brand-logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; text-decoration: none; color: var(--deep-black); text-transform: uppercase; }
        
        .product-container { max-width: 600px; margin: 0 auto; padding: 20px 5%; }
        .main-image { width: 100%; height: 380px; object-fit: contain; background: #f9f9f9; border: 1px solid var(--border); border-radius: 8px; }
        
        .info-section { margin-top: 20px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 24px; margin-bottom: 5px; }
        .price { font-size: 20px; color: var(--primary-gold); font-weight: 600; margin-bottom: 20px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .option-btn { border: 1px solid var(--border); background: var(--white); padding: 10px 15px; cursor: pointer; border-radius: 4px; }
        .option-btn.selected { background: var(--deep-black); color: var(--white); border-color: var(--deep-black); }
        
        .desc-box { margin-top: 25px; font-size: 13px; line-height: 1.6; color: #555; }
        .desc-box h4 { font-weight: 600; margin-bottom: 8px; color: var(--deep-black); text-transform: uppercase; }
        
        .bottom-bar { position: fixed; bottom: 0; width: 100%; display: flex; padding: 10px; background: var(--white); border-top: 1px solid var(--border); }
        .bottom-bar button { flex: 1; padding: 15px; font-weight: 600; border: none; cursor: pointer; text-transform: uppercase; }
        .btn-add { background: var(--primary-gold); color: var(--white); margin-right: 5px; }
        .btn-buy { background: var(--deep-black); color: var(--white); margin-left: 5px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" style="text-decoration: none; color: black; font-weight: bold;">&#8592; Back</a>
        <a href="index.html" class="brand-logo">Mohor</a>
        <span>Cart (0)</span>
    </nav>

    <div class="product-container">
        <img id="mainImage" class="main-image" src="" alt="Loading...">
        
        <div class="info-section">
            <h1 id="prodTitle">Loading Product...</h1>
            <div id="prodPrice" class="price"></div>
            
            <div class="desc-box">
                <h4>Sizes Available</h4>
                <div id="sizeOptions" class="btn-group"></div>
            </div>

            <div class="desc-box">
                <h4>Description</h4>
                <p id="prodDesc"></p>
            </div>
        </div>
    </div>

    <div class="bottom-bar">
        <button class="btn-add">Add to Cart</button>
        <button class="btn-buy">Buy Now</button>
    </div>

    <script>
        // 1. WE PUT THE DATA DIRECTLY IN THIS FILE SO IT CANNOT FAIL TO LOAD
        const myProducts = [
            {
                id: 1,
                title: "Peach Vila 3-Piece",
                price: 3200,
                image: "images/peach-vila-3piece/peach_vila1.jpg",
                sizes: ["38 (M)", "42 (L)", "44-46 (XL)"],
                desc: "A premium embroidered 3-piece ensemble featuring high-quality detailing. Designed with a loose fit for ultimate comfort."
            }
        ];

        // 2. RUN THE LOAD FUNCTION IMMEDIATELY
        function loadPage() {
            // Check URL for ID (defaults to 1 if none found for testing)
            const params = new URLSearchParams(window.location.search);
            const targetId = params.get('id') || 1; 

            // Find product
            const product = myProducts.find(p => p.id == targetId);

            if (!product) {
                document.getElementById('prodTitle').innerText = "Product Not Found";
                return;
            }

            // Inject Data into HTML
            document.getElementById('prodTitle').innerText = product.title;
            document.getElementById('prodPrice').innerText = "৳ " + product.price;
            document.getElementById('mainImage').src = product.image;
            document.getElementById('prodDesc').innerText = product.desc;

            // Generate Size Buttons
            const sizeContainer = document.getElementById('sizeOptions');
            product.sizes.forEach(size => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = size;
                btn.onclick = () => {
                    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                };
                sizeContainer.appendChild(btn);
            });
        }

        // Trigger the script
        loadPage();
    </script>

</body>
</html>
